<text x="820" y="408.8" font-size="11" font-weight="400" fill="#0F172A" text-anchor="start" >(depuis chaque état actif)</text>
<text x="20" y="530.0" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >Invariants : une seule Candidature par couple (étudiant, offre) ; au plus une Candidature Acceptee par étudiant (index unique partiel en base) ;</text>
<text x="20" y="545.0" font-size="12" font-weight="400" fill="#475569" text-anchor="start" >aucune transition depuis un état final (la règle vit dans l&#x27;agrégat, un test unitaire la fige).</text>
